  }

    return `${prefix} — couldn't reach the server. Check your internet connection and try again.`;
  }
  if (code === "unauthenticated") {
    return `${prefix} — you've been signed out. Please log in again.`;
  }
  if (code.startsWith("auth/")) {
    return err.message || `${prefix} — please try again.`;
  }
